[package]
name = "easy-port"
version = "0.2.0"
description = "Map any local port to a public HTTPS link, powered by cloudflared"
authors = ["zker67"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "easy_port_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 把 cloudflared 直接编进 exe（一体化单文件形态，体积 +53 MB）。
# 关闭时回退为 sidecar / PATH 查找，开发期用这个更快。
default = ["embed-cloudflared"]
embed-cloudflared = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 异步读取 cloudflared 的 stderr 输出（隧道链接由 stderr 打印）
tokio = { version = "1", features = ["process", "io-util", "rt", "macros", "sync", "time", "net"] }
# 从 cloudflared 输出中提取 trycloudflare.com 链接
regex = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# 探测本机服务的网页标题与 favicon（只请求 127.0.0.1，不走公网）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
base64 = "0.22"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
argon2 = { version = "0.6.0", features = ["getrandom"] }
include_dir = "0.7.4"
getrandom = "0.4.3"

# 按 pid 终止子进程：监视任务持锁 wait 时无法走 Child::kill，退回系统调用
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Job Object：把子进程绑到作业对象上，应用被强杀时由系统连带终止（不变量 5 的兜底）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
